<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego de banderas</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
  
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="principal">
    <h1>TRIVIA MUNDI</h1>
    <div class="inicio">
      <div class="registro">
        <label for="nombre">Usuario: </label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre">
      </div>
      <div class="opciones">
        <input id="btnJugar" type="button" value="JUGAR">
        <input id="btnRanking" type="button" value="RANKING">
      </div>
    </div>
    <div class="juego ocultar">
      <p id="progreso"></p>
      <div id="pregunta"></div>
      <div id="opciones"></div>
    </div>
    <div class="ranking ocultar">
      <h1>MEJORES PUNTAJES</h2>
      <div class="vistaRanking"></div>
      <input id="btnInicio" type="button" value="Inicio">
    </div>
  </main>
</body>
</html>
